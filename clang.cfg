# Dependency paths for the existing CLion/CMake debug build.
-std=c++20
-I<CFGDIR>/cmake-build-debug/_deps/cpr-src/include
-I<CFGDIR>/cmake-build-debug/_deps/cpr-build/cpr_generated_includes
-I<CFGDIR>/cmake-build-debug/_deps/curl-src/include
-I<CFGDIR>/cmake-build-debug/_deps/json-src/include
-L<CFGDIR>/cmake-build-debug/_deps/cpr-build/cpr
-Wl,-rpath,<CFGDIR>/cmake-build-debug/_deps/cpr-build/cpr
-Wl,-rpath,<CFGDIR>/cmake-build-debug/_deps/curl-build/lib
-lcpr
